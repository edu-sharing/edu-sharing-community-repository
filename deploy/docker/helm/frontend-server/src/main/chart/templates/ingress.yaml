{{- if not .Values.global.cluster.istio.enabled }}
{{- if .Values.ingress.enabled }}
{{- /*
  The frontend server takes the context path as catch-all; the repository service chart
  routes its backend prefixes (/edu-sharing/rest, ...) straight to tomcat. nginx picks the
  longest matching path, so /edu-sharing/rest wins over /edu-sharing - both ingresses must
  use the same hosts.
*/}}
{{- if .Values.ingress.exact.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-exact
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
  {{- with merge .Values.ingress.annotations .Values.global.cluster.cert.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.cluster.ingress.ingressClassName }}
  ingressClassName: {{ .Values.global.cluster.ingress.ingressClassName | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      # the frontend server redirects the bare root to the context path
      - path: /
        pathType: Exact
        backend:
          service:
            name: {{ include "edusharing_common_lib.names.name" $ }}
            port:
              number: {{ $.Values.service.port.api }}
  {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-prefix
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
  {{- with merge .Values.ingress.annotations .Values.global.cluster.cert.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.cluster.ingress.ingressClassName }}
  ingressClassName: {{ .Values.global.cluster.ingress.ingressClassName | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $.Values.ingress.paths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "edusharing_common_lib.names.name" $ }}
            port:
              number: {{ $.Values.service.port.api }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
