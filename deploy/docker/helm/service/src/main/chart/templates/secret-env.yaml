apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
type: Opaque
data:
  REPOSITORY_DATABASE_USER: {{ .Values.config.database.username | b64enc | quote }}
  REPOSITORY_DATABASE_PASS: {{ default .Values.global.password .Values.config.database.password | b64enc | quote }}
  {{- if .Values.config.mongo.enabled }}
  {{- $mongo := .Values.config.mongo }}
  {{- $port := $mongo.port | int }}
  {{- $replicas := $mongo.replicas | int }}
  {{- $hosts := list }}
  {{- if gt $replicas 1 }}
  {{- range $index := until $replicas }}
  {{- $hosts = append $hosts (printf "%s-%d:%d" $mongo.host $index $port) }}
  {{- end }}
  {{- else }}
  {{- $hosts = append $hosts (printf "%s:%d" $mongo.host $port) }}
  {{- end }}
  {{- $options := "" }}
  {{- if $mongo.authSource }}
  {{- $options = printf "?authSource=%s" ($mongo.authSource | urlquery) }}
  {{- end }}
  REPOSITORY_MONGO_CONNECTION_STRING: {{ (printf "mongodb://%s:%s@%s/%s%s" $mongo.username ((default .Values.global.password $mongo.password) | urlquery | replace "+" "%20") (join "," $hosts) $mongo.database $options) | b64enc | quote }}
  {{- end }}
  REPOSITORY_SERVICE_ADMIN_PASS: {{ default .Values.global.password .Values.config.admin.password | b64enc | quote }}
  REPOSITORY_SERVICE_MAIL_SERVER_SMTP_USERNAME: {{ .Values.config.mail.server.smtp.username | b64enc | quote }}
  REPOSITORY_SERVICE_MAIL_SERVER_SMTP_PASSWORD: {{ .Values.config.mail.server.smtp.password | b64enc | quote }}
