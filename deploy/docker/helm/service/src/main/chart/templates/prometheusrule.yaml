{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if .Values.global.metrics.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "edusharing_common_lib.names.name" . }}
      rules:
        {{- if .Values.config.metrics.rules.dbPoolFull.enabled }}
        - alert: dbPoolFull
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} reached the maximum database connection pool size since {{ .Values.config.metrics.rules.dbPoolFull.for }}.
            summary: >-
              {{ include "edusharing_common_lib.names.name" . }} reached the maximum database connection pool size.
          expr: alfresco_datasource_active_connection{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} >= {{ .Values.config.database.pool.max | int }}
          for: {{ .Values.config.metrics.rules.dbPoolFull.for }}
          labels: {{ toYaml .Values.config.metrics.rules.dbPoolFull.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.hazelcastInsufficientMemberships.enabled }}
        - alert: hazelcastInsufficientMemberships
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} hazelcast has insufficient memberships since {{ .Values.config.metrics.rules.hazelcastInsufficientMemberships.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} hazelcast has insufficient memberships.
          expr: hazelcast_member_total{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} < kube_statefulset_replicas{namespace="{{ .Release.Namespace }}",statefulset="{{ include "edusharing_common_lib.names.name" . }}"}
          for: {{ .Values.config.metrics.rules.hazelcastInsufficientMemberships.for }}
          labels: {{ toYaml .Values.config.metrics.rules.hazelcastInsufficientMemberships.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.hazelcastUp.enabled }}
        - alert: hazelcastUp
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} hazelcast is down since {{ .Values.config.metrics.rules.hazelcastUp.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} hazelcast is down.
          expr: hazelcast_up{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} < 1
          for: {{ .Values.config.metrics.rules.hazelcastUp.for }}
          labels: {{ toYaml .Values.config.metrics.rules.hazelcastUp.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.jvmHighGCRate.enabled }}
        - alert: jvmHighGCRate
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate (> {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}s) since {{ .Values.config.metrics.rules.jvmHighGCRate.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate.
          expr: >-
            rate(jvm_gc_collection_seconds_sum{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"}[5m]) > {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.jvmHighGCRate.for }}
          labels: {{ toYaml .Values.config.metrics.rules.jvmHighGCRate.labels | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}