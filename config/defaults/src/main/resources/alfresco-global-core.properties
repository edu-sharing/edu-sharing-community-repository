# edu-sharing core defaults for alfresco
# do NOT override this file in projects! Put project specific changes (deltas only) into
# config/defaults/alfresco-global.properties (loaded after this file, so any key set there wins).

authentication.ticket.useSingleTicketPerUser=false

# classes allowed to bind content (ContentData) via NodeService#setProperty
contentPropertyRestrictions.whitelist=org.alfresco.repo.version.EduVersion2ServiceImpl,org.edu_sharing.repository.server.ContentDataBinder

security.anyDenyDenies=false

spaces.user_homes.regex.pattern=^(\\w\\w)

system.usages.enabled=true

heartbeat.enabled=false

activities.feed.notifier.enabled=false
activities.feed.cleaner.enabled=false
activities.feed.generator.enabled=false
activities.post.cleaner.enabled=false
activities.post.lookup.enabled=false
