
// DO NOT EDIT THIS FILE
// this is the base config file
// make any custom modifications to the file "edu-sharing.conf"

// switch sso methode over spring profiles: basic (csrf protection), oauth2Enabled, samlEnabled
spring.profiles.active=basic

// security and management functions
security {
    // custom headers that will be included in ANY request, not only index pages but also API etc.
    // for frontend / html related headers like csp etc., see the angular part
    // headers {
        // Configure the X-Content-Type-Options, i.e. "nosniff"
        // X-Content-Type-Options: "nosniff"
    // }
    access: {
        // whether openapi access is allowed. possible values: "disabled", "admin", "enabled"
        openapi: "enabled"
        // config for rest endpoint
        // note: The list works with prefixes, so "/register" would disable all register endpoints
        // You can choose the state "disabled" or "admin"
        endpoints: {
           // "/statistic/v1/public": "admin"
           // "/statistic/v1/facets": "admin"
           // "/stream/v1": "admin"
           // "/relation/v1": "admin"
           // "/register/v1": "admin"
           // "/rating/v1": "admin"
           // "/notification/v1": "admin"
           // "/knowledge/v1": "admin"
           // "/feedback/v1": "admin"
           // "/comment/v1": "admin"
           // "/clientUtils/v1": "admin"
         }
         // config for any paths, like assets or other data
         // note: The list works with prefixes, so "/assets" would disable all paths below it
         // You can choose the state "disabled" or "admin"
         paths: {
            // "/assets/monaco": "admin"
         }
    }
    logging {
        // configure the displaying / output of errors via REST API
        // minimal: only the exception name
        // details: exception name + primary exception message
        // full: full stacktrace of exception (not recommended in production)
        displayLevel {
          // for any users
          default: "minimal"
          // for ALFRESCO_ADMINISTRATOR roles only
          admin: "minimal"
         }
    }
    fileManagement {
        limits: {
            // max allowed size of files that can be uploaded (in bytes)
            fileSize: null
        }
        mimetypeVerification: {
            // verify mimetypes via magic bytes (tika)
            // and block non white-listed mimetypes
            enabled: false
            // enable the support for unknown mimetypes (application/octet-stream). Not recommended
            allowUnknownMimetypes: false
            list: {
                // list of mimetype / allowed extensions (or "*" to allow any extension for this mimetype)
                // "image/jpeg": ["jpg", "jpeg"]
            }
        }
    }

    configuration {
        // When enabled, override files can be created and edited in the edu-sharing admin tools
        // We DO NOT RECOMMEND to enable this for production systems
        inlineEditing: true
    }

