    passwordPolicy: {
        minLength: 8
        maxLength: 30
        numberOfLowerCaseCharacters: 1
        numberOfUpperCaseCharacters: 1
        numberOfDigitCharacters: 1
        numberOfSpecialCharacters: 1
        maxLengthOfAlphabeticSequence: 5
        maxLengthOfNumericalSequence: 5
        illegalSubstrings: ["12345678"]
        illegalPasswords: ["password"]
    }
    authentication: {
        oauth2: {
            enabled: false
            // every entry below except clientId and authorizationGrantTypes is optional and may be left out
            clients: [
                {
                    clientId: "test-client"
                    // a confidential client, i.e. one that can keep a secret because it runs on a server.
                    // leave clientSecret out entirely for a public client, see the browser plugin example below
                    clientSecret: "{noop}123&Test"
                    clientAuthenticationMethod: "client_secret_basic"
                    authorizationGrantTypes:["authorization_code","refresh_token"]
                    // single redirect uri, kept for backwards compatibility. prefer redirectUris below,
                    // both may be set and are merged
                    redirectUri: "http://localhost:8081/login/oauth2/code/my-client"
                    // redirect uris matched exactly, as required by rfc 6749. the one exception is a
                    // loopback host (127.0.0.0/8, ::1), where the port of the request is ignored per
                    // rfc 8252, so a native client may bind to an ephemeral port
                    redirectUris: []
                    // redirect uris matched by pattern, for clients whose redirect uri is not known when
                    // this file is written - see the browser plugin example below. leave empty unless a
                    // client actually needs it: this relaxes the exact matching above, which is what keeps
                    // an authorization code from being sent to an attacker controlled url.
                    redirectUriPatterns: []
                    // note that "openid" only works with openid connect enabled, see the note at the end
                    // of this list
                    scopes:["openid","profile","read"]
                    // expiration of access tokens (i.e. PT1H)
                    accessTokenExpires:""
                    // expiration of access tokens (i.e. P30D)
                    refreshTokenExpires:""
                    requireConsent: false
                    // require pkce (rfc 7636). always on for a public client and for a client using
                    // redirectUriPatterns, no matter what is set here
                    requireProofKey: false
                    // hand a refresh token to a public client, see the browser plugin example below.
                    // no effect on a client that authenticates with a secret, it gets one anyway
                    forceRefreshToken: false
                }

                // a public client using the authorization code flow with pkce - a browser extension,
                // mobile app or single page app. it holds no secret, so the code_verifier is the only
                // thing tying the token request back to whoever started the flow.
                //
                // {
                //     clientId: "browser-plugin"
                //     // marks the client as public: no secret, and pkce is enforced automatically
                //     clientAuthenticationMethod: "none"
                //     authorizationGrantTypes: ["authorization_code", "refresh_token"]
                //     // a chrome extension id is stable once the extension is published, so its
                //     // redirect url can be registered exactly and needs no pattern. write the real id
                //     // here - a placeholder in angle brackets makes the uri invalid (< and > are not
                //     // legal uri characters) and the client is then dropped with an error at startup
                //     redirectUris: ["https://bdpcahnkimdbloipcandiohimejodhmk.chromiumapp.org/"]
                //     // patterns, for redirect urls that cannot be known here: firefox generates the
                //     // uuid in its redirect url per *installation*, and an unpacked chrome dev build
                //     // gets a fresh id per installation as well. matching is done component by
                //     // component, a "*" never crosses a component boundary:
                //     //   scheme      must be equal
                //     //   host, port  a "*" stands for exactly one label, so "https://*.example.org/"
                //     //               matches "https://abc.example.org/" but neither
                //     //               "https://a.b.example.org/" nor "https://evil.org/x.example.org/"
                //     //   path        a "*" stands for anything within one segment. note that the
                //     //               trailing slash matters: chrome.identity.getRedirectURL() returns
                //     //               "https://<id>.chromiumapp.org/", which "https://*.chromiumapp.org"
                //     //               does NOT match. with a path, as in getRedirectURL("callback"),
                //     //               use "https://*.chromiumapp.org/*" or spell the path out
                //     //   query       must be equal, or absent on both sides
                //     // keep the pattern as narrow as the client allows - anything it matches is a url
                //     // this repository will hand an authorization code to.
                //     redirectUriPatterns: [
                //         "https://*.chromiumapp.org/"
                //         "https://*.extensions.allizom.org/"
                //     ]
                //     scopes: ["profile"]
                //     // a public client cannot be authenticated, so let the user see what it asks for
                //     requireConsent: true
                //     // spring hands no refresh token to a public client, so without this the plugin has
                //     // to run the authorization code flow again every time the access token expires.
                //     // that is often fine: the browser still holds the repository session and the
                //     // consent is already stored, so it goes through without any user interaction.
                //     // switch this on only if that does not work for you. rfc 9700 permits a refresh
                //     // token here as long as it is rotated, so rotation is turned on together with the
                //     // flag - which means the client MUST store the new refresh token it gets back on
                //     // every refresh, otherwise it locks itself out after the first one.
                //     forceRefreshToken: false
                //     // leave refreshTokenExpires empty next to it: the token then keeps spring's one
                //     // hour default, which is the right order of magnitude for a client that cannot be
                //     // authenticated. TODO: a refresh token stays valid without the user being present,
                //     // and there is currently no view in which they could see or revoke it. the pieces
                //     // are there (/oauth2server/revoke, table oauth2_authorization), the ui is missing.
                // }
                //
                // note on openid connect: it is disabled (the .oidc(...) call in
                // OAuth2AuthorizationServerConfig is commented out), so this is a plain oauth2
                // authorization server. an authorization request asking for the "openid" scope is
                // rejected with invalid_scope, and there is no id_token, no /oauth2server/userinfo and no
                // /.well-known/openid-configuration. discovery is still available - rfc 8414 does not
                // depend on openid connect: GET /.well-known/oauth-authorization-server, which also
                // advertises code_challenge_methods_supported: ["S256"].
                //
                // note on cors: the authorization request is a normal browser navigation and needs none.
                // the token request is a fetch and would, but a browser extension that lists this
                // repository in its manifest host_permissions is exempt from cors for it. a client that
                // does not qualify (a content script, a single page app) currently cannot use the token
                // endpoint cross origin - /oauth2server/* sends no cors headers.
            ]
            // external identity providers whose access tokens are accepted as bearer tokens.
            // this is deliberately separate from the sso login configuration (security.sso): trusting an
            // idp for interactive login is a different decision than trusting it for machine access to
            // the api. tokens of an issuer that is not listed here are never accepted.
            // note that this does not require `enabled` above - the repository can accept foreign tokens
            // without running its own authorization server.
            trustedIssuers: [
                // {
                //     // must match the iss claim of the token exactly. also used to fetch the keys
                //     // via openid discovery (<issuerUri>/.well-known/openid-configuration)
                //     issuerUri: "https://keycloak.example.org/realms/edu"
                //     // optional. skips discovery and uses this jwk set uri directly
                //     jwkSetUri: ""
                //     // the token is rejected unless its aud claim contains this value. this is the
                //     // recommended check: it binds the token to this repository as its target, so a
                //     // token the calling application obtained for a different service cannot be
                //     // replayed here. in keycloak, aud is not filled by default - it requires an
                //     // audience mapper (client scopes -> add mapper -> by configuration -> audience).
                //     audience: "edu-sharing-api"
                //     // the token is rejected unless its azp claim equals this value, i.e. unless it was
                //     // issued to this specific client. keycloak fills azp without any mapper, but the
                //     // claim is idp specific and not part of rfc 9068 - prefer audience where possible.
                //     authorizedParty: ""
                //     // at least one of audience / authorizedParty must be set, otherwise every token of
                //     // this issuer would be accepted, no matter which client or service it was meant for.
                //
                //     // claim carrying the edu-sharing user name, defaults to sub. note that keycloak
                //     // puts a uuid into sub - preferred_username is usually the useful one.
                //     usernameClaim: ""
                //     // maps every token of this issuer to one fixed, already existing edu-sharing user
                //     // and ignores usernameClaim. this is the recommended setup for machine accounts:
                //     // the mapping lives here instead of depending on a generated name in the idp.
                //     username: ""
                // }
            ]
        }
    }
}

// basic repository features
repository: {
    multilang: false // multilang support, this is a legacy variable and only "false" is supported
    // permission mapping from remote lms systems-
    lmsCodes: "moodle,moodle/course:delete,moodle/course:update;fronter,fronter/course:delete,fronter/course:update;opal,opal/course:delete,opal/course:update"
    // deliver repository metadata with url: http://host:8080/edu-sharing/metadata
    exportMetadata: true
    // config for jupyter notebook binder service. Set to true in order to activate checking github urls for jupyter notebook files. (requires restart).
    detectBinderUrls: false
    // configs for childobjects (series objects)
    childobjects: {
        // metadata fields that are ignored when inheriting the metadata from the parent element (starting with 10.0: short property notation)
        ignoredInheritMetadata: [
            "cm:name",
            "ccm:educationallearningresourcetype",
            "ccm:commonlicense_key",
            "ccm:license_description",
            "ccm:commonlicense_cc_locale",
            "ccm:commonlicense_cc_version",
            "ccm:wwwurl",
            "AlfrescoMimeType",
            "ccm:ccressourcetype",
            "cclom:format",
            "cclom:size"
        ]
    }
    mimetypes {
        // set a widget id (i.e. ccm:educationallearningresourcetype) where the "icon" element will be used as a font
        // in this case, the static svg previews based on the mimetypes will be replaced
        nodeIconWidgetId: null
        // fallback icon for nodes where the given property is not set or has no icon value in the valuespace
        // when set, the given fallbackIconId will be used. If unset, the default mimetype svg will be used (i.e. "help_outline")
        nodeIconFallbackId: null
    }
    // parser configs (for file type detection)
    parsers {
        // detection of html files bundled within a zip
        eduhtml {
            // regex pattern which files in a zip file will trigger it as an "eduhtml" (page to be displayed as html)
            indexPattern: "(?i)^index\\.html?$"
        }
    }
    //database related options
    database:{
        // scripts to run on startup (e.g. for updating tables)
        // will be run in the order of the array
        scripts:{
            // core scripts, please DO NOT override or change them
            core:[
                "tracking.sql",
                "tracking.u1.sql",
                "tracking.u2.sql",
                "tracking.u3.sql",
                "tracking.u4.sql",
                "tracking.u5.sql",
                "factualterm.sql",
                "factualterm.u1.sql",
                "timed-permission.sql",
                "timed-permission.u1.sql",
                "oidc-session-registry.sql",
                "share.sql",
                "jobqueue.sql",
                "contributor.sql"
                ],
            custom:[] // any custom scripts (this can be safely overriden)
        }
    }
    // guest configuration
    guest: {
        enabled: false
        username: "esguest"
        groups: []
    }

    //context configuration:
    context: {
        // id-of-context: {
        //     repository.guest: {
        //         enabled: true
        //         username: "someOtherGuest"
        //         groups: ["someOtherGuest"]
        //     }
        // }
    }
    // configuration for groups
    groups: {
        // auto create groups on startup
        create: [
            // {
               //  // id of the group (GROUP_ prefix is not necessary)
               //  id: "MY_GROUP"
               //  // display name of the group
               //  displayName: "My group name"
               // array of members. If set all manually set memberships will be reset on every restart!
               // note that the given groups/members must be created beforehand in the list!
               // members: ["GROUP_ID1"]
            // }
        ]
    }
    // configuration for default user
    persons: [
         // {
         //   authorityName: "MMiller",
         //   profile: {firstName:"Mike", lastName:"Miller"}
         //   password: "1234",
         //   primaryAffiliation: "teacher",
         //   groups: ["GROUP_A"]
         // }
    ]
    // configuration for toolpermissions
    toolpermissions: {
        // managed toolpermissions
        // note: These toolpermissions will always re-configure on startup
        managed: [
//            {
//                // name of the tp (will be created if not exists)
//                id: "TOOLPERMISSION_EXAMPLE"
//                // allowed authorities (make sure they exists, see the groups config)
//                allowed: ["GROUP_EVERYONE"]
//                // explicitly denied authorities (make sure they exists, see the groups config)
//                denied: []
//            }
        ]
    }
    // mailserver config
    mail {
        // mail sender of automated mails
        from: "",
        // if true, add the persons e-mail who initiated the event
        addReplyTo: true,
        // config for register mails (new users registered)
        register {
            //receiver: null
        }
        // when set, all mail templates will be send using the given locale
        // if not set, the locale of the current users session triggering the mail will be used
        // example: en_US, de_DE
        locale: null
        // config for node report mail feature
        report {
            // List of mail report receivers
            receivers: []
        }
        server {
            smtp {
                host: "",
                port: 25,
                username: "",
                password: "",
                // either "tls" or empty for generic authentication
                authtype: ""
            }
        }
    }
    // statistics endpoints (for providing public information about content counts, user counts, etc.)
    statistics:{
        // shall the iam/person api provide statistics by user?
        // this might impact the system performance
        // if disabled, the profile/about page won't show statistical numbers about an user
        byUser: true
        api:{
            enabled:false
        }
        // limits the search results of ranged node statistic queries (like owner, organisation and selection requests) because of physical limitations by db
        searchResultsLimit: 50000
        // the maximum converted elements for the client view/live output. These will be the xxx most viewed/used nodes (limited after sorting)
        // higher values will slow down the view & endpoint
        outputLimit: 200
    }
    // config for bulk import api
    bulk: {
        // register one or more interceptors of type BulkServiceInterceptorInterface
        // please refer to the interface definition for usage
        interceptors: []
    }
    // configuration relevant for edu-sharing organizations
    organizations {
        // configuration for admin groups
        admins {
            // whether members can manage their groups/users inside the organizations
            // when enabled, they'll have access to the "User management" view
            canManage: true
        }
        // will marks ownership of materials
        markOwnership: true
    }
    // allow and control how the system communicates with other systems
    communication:{
        resolveUrlInformation:true // allows the repository to fetch metadata from a url ressource (when saving a link)
        // configure playwright (so automatic thumbnails from websites are supported)
        metadatasets: {
            // allow access to remote valuespaces, i.e. skos
            // when disabled, external valuespaces will NOT be resolved and the widget values might be empty
            externalValuespaces: true
        }
        playwright: {
            // url to playwright API, e.g. "https://thumbnail.example.com" (without a trailing / )
            url: null
            // max time to wait for playwright to generate a screenshot
            timeout: 10
            // in case your playwright is secured via api key, enter it here
            api_key: ""
            // you may add more keys, they will be added as url params for playwright
            // see the api docs of the playwright container
            width: 900  // default aspect is 3:2 for best fit on grid entries
            height: 600
        }
        // DEPRECATED: use playwright if possible
        // configure splash (so automatic thumbnails from websites are supported)
        splash: {
            // url to splash, e.g. "https://thumbnail.example.com/render.png"
            url: null
            // time to wait before website is captured
            wait: 0.5
            // max time to wait for splash to generate a screenshot
            timeout: 10
            // you may add more keys, they will be added as url params for splash
        }
        // duplicate finder service
        duplicate {
            // url of the service
            url: null
            // minimum similarity [0-1]
            similarity_threshold = 0.9
        }
        preview {
            // regex list of allowed remote image sources to proxy through the repo
            remoteAllowList: [
                "https(.*)pixabay\\.com\\/(.*)",
                "https(.*)ytimg.com\\/(.*)"
            ]
        }
    }
    // config for information dislcosuring of the repository, i.e. which information might be publicly visible
    disclosure: {
        // disclosure of all 3rd-party libraries and their licenses
        // either off (no disclouse at all), "minimal" (only libraries, without versions) or "all"
        // note: the admin role can still access the full information regardless of this settings
        licenses: "minimal"
    }
    // configure tracking related functions
    tracking:{
        // track incremental view + download count in alfresco properties (disable for better access performance)
        alfresco: true
        userMode: "session" // the mode to track users, either "obfuscate", "session", "none" or "full"
        sharedWithMediacenter: false // tracks the list of media centers shared with the node
    }
    // the default required status for users to login. If not set, any status will be accepted
    personActiveStatus: "active"

    // privacy related configurations
    privacy: {
       // if true, e-mail all e-mail addresses inside vcards will be filtered if the user has no write permissions on the item
       // affects any api output like REST or OAI
       filterVCardEmail: false
       // if true, all e-mail addresses of creators/modifiers will be filtered if the user has no write permissions on the item
       filterMetadataEmail: false
    }
    // config for feedback feature
    feedback: {
        // how the authority should be stored on feedback
        // "full": Full authority, no obfuscation,
        // "obfuscate": Obfuscation/hashing of the authority
        // "session": Session id of the authority (when used, you can allow the toolpermission "TOOLPERMISSION_FEEDBACK" for everyone to allow feedback from guest users)
        // "external": External managed ID by identity provider (requires explicit support of the external idp!)
        userMode: "obfuscate"
        // allow multiple feedback per one user (only supported when userMode "full" or "obfuscate"
        // when disabled, new feedback will automatically override old feedback of the same user
        allowMultiple: false
    }
    relations: {
      trace: {
        maxDepth: 3
      }
    }


    httpclient: {
        // proxy to use for http requests (e.g. querying import data)
        proxy: {
            //proxyhost:proxyhost
            //proxyport:3128
            //proxyuser
            //proxypass
            //nonproxyhosts
        }
        //disableSNI4Hosts: ["misconfigured.ssl.host"]
    }
    graphql: {
        servlet: {
            subscriptionTimeout: 0s
            async: {
                enabled: true
                timeout: 30s
                threads: {
                    min: 10
                    max: 200
                }
            }
        }
    }

    request: {
        // mapping of information about the origin of requests, in case the repository is behind a proxy
        // leave this values set to "null" if the repository is not behind any proxy
        proxyHeader: {
            // header to find origin ip, for nginx this is 'x-real-ip'
            ip: null
            // header to find http 'Host:' information, for nginx this is 'x-forwarded-host'
            host: null
        }
    }

    // configuration of the DOI handleservice
    // please note that a valid configuration for "publish" must be present!
    handleservice: {
        // is the handleservice active?
        enabled: false
        //prefix: ''
        // path of the private key file
        //privkey: ''
        //repoid: ''
        //email: ''
        // path to a writeable directory. defaults to $HOME/.handle/
        //configDir: ''
    }
    // please note that a valid configuration for "publish" must be present!
    doiservice: {
            // flag to enable/disable an configured doiservice, repo needs to be restarted
            enabled: false
            // is used to specify a different URL to the repo node entry for all DOIs. e.g. https://myrepo.com/edu-sharing/
            // repoUrl: ''
            // https://api.test.datacite.org for test,  https://api.datacite.org for prod
            //baseUrl: ''
            // credentials for using the api
            //accountId: ''
            //password: ''
            // prefix context the dois are created
            //prefix: ''
    }
    register: {
        // Class to use, for creating Alfresco Users use "RegisterServiceImpl", for LDAP "RegisterServiceLDAPImpl"
        class: "RegisterServiceImpl"
        // Configuration only relevant if LDAP is used
        ldap: {
            // to allow user edit via ui for ldap users
            // this key should be the lefthand value of your chain id from alfresco
            // i.e. authentication.chain=alfinst:alfrescoNtlm,ldap1:ldap -> ldap1
            authMethodAlfName: null
            // Authentication method
            authentication: "simple"
            // Server, should start with ldap://
            server: null
            // Username/dn to authenticate on the ldap server (this user should have write permissions to bind new authorities)
            username: null
            // Password for the user
            password: null
            // The baseDN (where to create new users)
            baseDN: "ou=people,dc=nodomain"
            // Hashing algorithm for passwords (currently md5 or none supported)
            passwordAlgorithm: "md5"
            userRdn: "uid"
        }
    }
    // service description, kind of a detail card about your repository
    // please see https://github.com/dini-ag-kim/oer-metadata-schemas/blob/master/service-card-example.json
    serviceDescription: {
      "name":"",
      "inLanguage":"de",
      "description":"",
      "type":"Repository",
      "audience":[
        {
          "name":"teacher"
        }
      ],
      "isAccessibleForFree":false,
      "coverage":"Organization",
      "startDate":"",
      "about":[],
      "provider":{
        "name":"",
        "location":{
          "geo": {
            "addressCountry": "de",
            "longitude": 0,
            "latitude": 0
          }
        },
        "url":"",
        "email":""
      }
    }
    interceptors: {
        authentication: {
            // login interceptor (must implement org.edu_sharing.alfresco.authentication.LoginInterceptor)
            login: [
                // org.edu_sharing.alfresco.authentication.LoginInterceptor
            ]
        }
        properties: {
            get: [
                org.edu_sharing.service.nodeservice.PropertiesGetInterceptorDefault,
                // org.edu_sharing.service.nodeservice.PropertiesGetInterceptorAuthors
            ],
            set: [
                // org.edu_sharing.service.nodeservice.PropertiesSetInterceptorTypicalAgeRangeCluster
            ]
        }
        permissions: [
                // {
                //  clazz: "org.edu_sharing.service.nodeservice.NodeServiceInterceptorPermissionsExample"
                // 	regexp: ".*"
                // }
        ]
    }

    // search related configs for queries which are not handled by the mds
    search {
        // groups related search configs
        groups: {
            // field/solr/elastic key to match when non fuzzy group search is enabled
            // examples: "=@cm:authorityDisplayName", "=@ccm:groupEmail"
            // for elastic, you might also only use the field name like "cm:authorityDisplayName"
            nonFuzzyField: "cm:authorityDisplayName"
        }
    }

    webdav: {
        enabled: true
        session: {
            // activate or deactivate sessions in webdav
           enabled: true
        }
        authentication: {
            // enable in project-services.xml by setting bean WebDavAuthenticationFilter:
            // <bean name="WebDavAuthenticationFilter" class="org.alfresco.repo.webdav.auth.LDAPAuthenticationFilter"/>
            ldap: {
                uri:"ldap://172.17.0.1:389"
                base:"ou=People,dc=example,dc=org"
                sec: {
                    auth: "simple"
                    user: "cn=admin,dc=example,dc=org"
                    pwd: "admin"
                }
                from: "mail"
                to: "uid"
                uid: "uid"
                alfrescoAuthComponent: false
            }
            // Authentication against the idm-rest service (see openapi.yaml).
            // To use it, activate the filter in project-services.xml:
            // <bean name="WebDavAuthenticationFilter" class="org.alfresco.repo.webdav.auth.IDMRestAuthenticationFilter"/>
            idmRest: {
                // Base URL of the logineo-idm-rest service (without the /api/v1/authenticate path).
                url: "https://idm-rest.example.org"
                // Technical user (HTTP Basic). Must have the Master or ReadOnlyMaster role on the IDM side.
                user: "edu-sharing"
                password: "secret"
                //request timeout in seconds (default 10).
                timeoutSeconds: 10
            }
        }
    }
    transformer: {
        // thread count for transformers. Must always be way lower than the amount of your db connection pool!
        threadCount: 2
        preview: {
            maxRunning: 10
            delay: 5000
        }
    }

    //bapi: {
      //uri: ""
      //authUserApiKey: ""
      //guestApiKey: ""
      //callTimeout: "PT1m"
      // features: ["url-fulltext"]  // activate to use bapi for fulltext extraction instead of local transformer
    //}
    dataprotection: {
        enabled: false
        //retentionPeriod: "PT240H"
        //metadataExport: true
        //binaryExport: true
        //summaryExport: true
        //fileName: "dataprotectioninfo_edu-sharing"
        //templatePath: "html/dataprotection/report.html"
        //links: ["http://edu-sharing.com","http://edu-sharing.net"]
        //cronExpression: "Cron[0 * * * * ?]"
    }
    // support of the safe feature (WORKSPACE_SAFE)
    safe: {
        // if feature is supported; Please note that disabling will disable the Node Service filter interceptors for safe scoped nodes!
        // disabling can slightly improve performance
        // requires restart
        enabled: true
    }
    users {
        // enable the support for type of users (field "type" on person POJO)
        // when enabled, for each users the memberships are checked and the group types are applied to the user
        // please note that enabling this may siginificantly slows down user lookup if cache is not build up
        inheritTypes: false
    }
}
// config for copy-based publishing of nodes
publish{
    // the node if of the parent node where published nodes get stored
    node: null
    // the pattern of the node structure (must be using date pattern data)
    nodePattern: "yyyy/MM/dd"
    // the authorityName of the new owner of published nodes
    owner: null
}
// config for assignments and submissions
assignment{
    // the pattern of the node structure (must be using date pattern data)
  nodePattern: "yyyy/MM/dd"
}
// rendering related config
rendering {
    forceRenderingService1: false
    // shall the rendering service pre-render (cache) objects after creation?
    prerender: true
}
// config for frontend/security related headers etc.
angular {
    headers: {
        // enable browser XSS protection (1 is usually the default of browsers)
        X-XSS-Protection: "1"
        // Configure Referrer-Policy, i.e. "no-referrer"
        // Referrer-Policy: "no-referrer"
        // configure allowed ulrs where this edu-sharing ui might be embedded as a frame/embed object
        X-Frame-Options: "sameorigin"
        // be careful when modifying these parameters!
        // also test rendering service and external tools, like the app
        Content-Security-Policy: {
            default-src: "* data: blob: 'self' gap://ready"
            // restrict the connect-src if feasible. Please keep in mind that the rendering and app must also be allowed
            // "data:" is required for local image selection in edit collection view
            connect-src: "* data:"
            img-src: "* data: blob:"
            style-src: "* 'unsafe-inline'"
            script-src: "* 'unsafe-inline' 'unsafe-eval' https://app-registry.edu-sharing.com"
            font-src: "'self' data:"
        }
        // stricter policy, please be aware that some features like custom html content won't work
        // Content-Security-Policy: {
        //     default-src: "data: blob: 'self' gap://ready"
        //         connect-src: "'self' gap://ready data:"
        //         img-src: "'self' data: blob"
        //         // see also: https://angular.io/guide/security#content-security-policy
        //         style-src "* 'nonce-{{ngCspNonce}}'"
        //         script-src: "'self' 'unsafe-inline'"
        //         font-src: "'self' data:"
        //     }
        // }
    }
    // info file for robots (robots.txt)
    // each array entry represents a file line
    robots: [
        "User-Agent: *"
        "Disallow:"
        "Sitemap: {{sitemap}}"
    ]
}
