<div class="sidebar-wrapper">
  <div class="loading" *ngIf="editorialSidebarService.sidebarLoading()">
    <es-spinner></es-spinner>
  </div>
  <div class="sidebar-header">
    <button
      mat-icon-button
      *ngIf="enabledOption() && !enabledOption().trap"
      (click)="enabledOption.set(null)"
    >
      <i esIcon="keyboard_arrow_left" [aria]="true"></i>
    </button>
    <div>
      {{ title() | translate }}
    </div>
    <button mat-icon-button (click)="close()">
      <i esIcon="close" [aria]="true"></i>
    </button>
  </div>
  <div class="sidebar-container">
    <ng-container *ngTemplateOutlet="content"></ng-container>
    <ng-template #content>
      <div
        *ngIf="enabledOption()?.option as option"
        class="option option-{{ option | propertySlug }}"
      >
        <es-nodes-selector
          *ngIf="option === 'SORT_INTO' || option === 'MANAGE_CONTENT'"
          [option]="enabledOption()"
          [parent]="parent()"
          [primaryMode]="primaryMode()"
        ></es-nodes-selector>
        <es-metadata-sidebar
          *ngIf="option === 'WORKSPACE_METADATA'"
          [nodeSidebar]="$any(editorialSidebarService.nodes())?.[0]"
        ></es-metadata-sidebar>
        <es-submission-sidebar
          *ngIf="option === 'MANAGE_SUBMISSION'"
          [data]="$any(enabledOption().optionConfig)"
          (dataChange)="editorialSidebarService.patchOptionConfig($event)"
        ></es-submission-sidebar>
        <es-assignment-sidebar
          *ngIf="option === 'VIEW_ASSIGNMENT'"
          [data]="$any(enabledOption().optionConfig)"
        ></es-assignment-sidebar>
        <es-preview-sidebar
          *ngIf="option === 'PREVIEW'"
          [node]="$any(editorialSidebarService.nodes())?.[0]"
          [editorMode]="$any(enabledOption()?.optionConfig)?.editorMode || 'viewer'"
          [groupId]="$any(enabledOption()?.optionConfig)?.groupId || 'preview_sidebar'"
        ></es-preview-sidebar>
      </div>

      <div class="entries" *ngIf="!enabledOption()">
        <ng-container *ngIf="options()?.length">
          <div
            class="entry"
            *ngFor="let option of options()"
            [tabindex]="option.isEnabled ? 0 : -1"
            cdkMonitorElementFocus
            (click)="option.callback(editorialSidebarService.nodes())"
            [attr.aria-disabled]="!option.isEnabled"
            [class.disabled]="!option.isEnabled"
          >
            <i class="icon" [esIcon]="option.icon"></i>
            <div class="text">
              <div
                class="title"
                esCheckTextOverflow
                #text="esCheckTextOverflow"
                [matTooltip]="text.hasTextOverflow() ? (option.name | translate) : null"
              >
                {{ option.name | translate }}
              </div>
              <div
                class="description"
                esCheckTextOverflow
                #description="esCheckTextOverflow"
                [matTooltip]="
                  description.hasTextOverflow() ? (option.name + '_DESCRIPTION' | translate) : null
                "
              >
                {{ option.name + '_DESCRIPTION' | translate }}
              </div>
            </div>
            <i class="navigate" esIcon="keyboard_arrow_right"></i>
          </div>
        </ng-container>
        <es-info-message *ngIf="!options()?.length" mode="info">
          <div class="message">
            {{
              'EDITORIAL.SIDEBAR.NO_OPTIONS' +
                (editorialSidebarService.nodes()?.length ? '_SELECTION' : '_NO_SELECTION')
                | translate
            }}
          </div>
        </es-info-message>
      </div>
    </ng-template>
  </div>
</div>
