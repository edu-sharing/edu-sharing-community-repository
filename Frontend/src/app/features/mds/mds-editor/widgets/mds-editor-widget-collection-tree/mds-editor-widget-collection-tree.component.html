<div
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  esBorderBoxObserver
  #origin
  #triggerBorderBox="borderBoxObserver"
  (focusout)="onFocusOut($event)"
>
  <es-mds-editor-widget-container
    #container
    [widget]="widget"
    [label]="false"
    [injectedView]="this"
    [valueType]="valueType"
    [control]="control"
    [hasValues]="hasValues"
  >
    <!-- The chip grid controls the form so that required and disabled states apply to it. -->
    <mat-chip-grid
      #chipGrid
      [attr.aria-labelledby]="chips().length ? container?.labelId : null"
      [class.is-expanded]="overlayOpen()"
      [formControl]="control"
    >
      @for (chip of chips(); track chip.id) {
      <mat-chip-row
        [value]="chip.id"
        [removable]="true"
        [class.chip-error]="chip.status === 'error'"
        [matTooltip]="
          (chip.path || chip.title) +
          ' (' +
          ((chip.status === 'error'
            ? 'MDS.COLLECTION_TREE.NOT_ACCESSIBLE'
            : 'MDS.DELETE_KEY_NOTICE'
          ) | translate) +
          ')'
        "
        matTooltipPosition="above"
        (click)="onChipClick(chip)"
        (keydown.enter)="onChipClick(chip)"
        (removed)="remove(chip.id)"
      >
        @if (chip.status === 'loading') {
        <es-spinner-small class="chip-spinner"></es-spinner-small>
        } @if (!chip.hasWrite) {
        <i esIcon="lock" class="chip-write-marker" [aria]="false"></i>
        <span class="cdk-visually-hidden">{{
          'MDS.COLLECTION_TREE.NO_WRITE_PERMISSION' | translate
        }}</span>
        }
        <span class="mat-chip-label">{{ chip.title }}</span>
        <i esIcon="cancel" matChipRemove [aria]="false"></i>
      </mat-chip-row>
      }
      <!-- The grid only has role="grid" while it contains chips. -->
      <div class="input-wrapper" [attr.role]="chips().length ? 'row' : null">
        <span class="input-cell" [attr.role]="chips().length ? 'gridcell' : null">
          <input
            readonly
            autocomplete="off"
            [placeholder]="chips().length ? '' : widget.definition.placeholder || ''"
            [matChipInputFor]="chipGrid"
            (focus)="openOverlay()"
            (click)="openOverlay()"
          />
        </span>
        <span class="input-cell" [attr.role]="chips().length ? 'gridcell' : null">
          <button
            mat-icon-button
            class="mat-button-select-arrow"
            #openButton
            (click)="toggleOverlay()"
            [attr.aria-label]="'MDS.SHOW_OPTIONS_BUTTON' | translate"
            [attr.aria-expanded]="overlayOpen()"
            [disabled]="control.disabled"
          >
            <i esIcon="keyboard_arrow_down" class="mat-select-arrow"></i>
          </button>
        </span>
      </div>
    </mat-chip-grid>
  </es-mds-editor-widget-container>
</div>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayFlexibleDimensions]="true"
  [cdkConnectedOverlayMinWidth]="overlayOpen() ? origin.getBoundingClientRect().width : 0"
  [cdkConnectedOverlayWidth]="triggerBorderBox.width$ | async"
  [cdkConnectedOverlayOpen]="overlayOpen()"
  (overlayKeydown)="onOverlayKeydown($event)"
  (overlayOutsideClick)="closeOverlay($event)"
>
  @if (treeState(); as state) {
  <div
    class="suggestion-card"
    role="dialog"
    [attr.aria-labelledby]="container?.labelId"
    (focusout)="onFocusOut($event)"
  >
    <es-mds-editor-widget-collection-tree-core
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="false"
      [state]="state"
      [selected]="selectedSet()"
      [requireWrite]="!!config().requireWrite"
      (toggled)="onToggled($event)"
      (closed)="closeOverlay(undefined, true)"
    ></es-mds-editor-widget-collection-tree-core>
  </div>
  }
</ng-template>

<!-- Load styles for mat-select-arrow. -->
<mat-select hidden class="display-none"></mat-select>
