<es-mds-editor-widget-container
  #container
  [widget]="widget"
  [label]="true"
  [valueType]="valueType"
  [hasValues]="hasValues"
  [control]="formArray"
  [wrapInFormField]="false"
  [showSpinner]="isInitState$ | async"
>
  @if (hasFilter()) {
  <mat-form-field class="filter-field">
    <mat-label>{{ 'MDS.FILTER_FACET' | translate }}</mat-label>
    <input matInput [formControl]="filter" type="search" />
  </mat-form-field>
  } @if (formArray) {
  <ul [formGroup]="$any(formArray)" class="checkboxes-group">
    @for (control of formArray.controls; track control; let i = $index) {
    <li>
      <mat-checkbox [formControlName]="i">
        <span class="label">
          <span
            class="caption"
            esCheckTextOverflow
            #text="esCheckTextOverflow"
            (mouseenter)="text.hasTextOverflow()"
            [matTooltip]="text.hasTextOverflow() ? getFacet(i).label : null"
            [innerHTML]="getFacet(i).label | escapeHtml | highlight : filter.value"
          ></span>
          <span class="count">{{ getFacet(i).count }}</span>
        </span>
      </mat-checkbox>
    </li>
    }
  </ul>
  } @if ( (facetAggregationSubject | async)?.hasMore && facetValuesFiltered?.length <
  MAX_FACET_COUNT ) {
  <button
    mat-button
    color="primary"
    (click)="onLoadMore()"
    [disabled]="isLoading"
    class="load-more-button"
  >
    {{ 'LOAD_MORE' | translate }}
    @if (!isLoading) {
    <i esIcon="keyboard_arrow_down"></i>
    } @if (isLoading) {
    <es-spinner-small class="spinner"></es-spinner-small>
    }
  </button>
  }
</es-mds-editor-widget-container>
