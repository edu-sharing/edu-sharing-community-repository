@if (filteredSuggestions$ | async; as suggestions) {
<es-mds-editor-widget-container
  #container
  [widget]="widget"
  [label]="'SEARCH.FILTER_BY' | translate : { property: widget.definition.caption }"
  [wrapInGroup]="false"
  [injectedView]="this"
>
  <!-- Each suggestion is a button that adds it as filter; the list is named by the category label. -->
  <ul class="suggestion-list" [attr.aria-labelledby]="container.labelId">
    @for (suggestion of suggestions; track suggestion.value) {
    <li>
      <button
        #suggestionButton
        type="button"
        class="suggestion-button filter-chip-{{ widget.definition.id | propertySlug }}"
        [attr.aria-label]="
          (widget.definition.caption ? 'SEARCH.ADD_FILTER' : 'SEARCH.ADD_FILTER_VALUE')
            | translate : { property: widget.definition.caption, value: suggestion.label }
        "
        (click)="add(suggestion)"
        [matTooltip]="getTooltip(suggestion)"
        matTooltipPosition="above"
      >
        {{ suggestion.label }}
      </button>
    </li>
    }
  </ul>
</es-mds-editor-widget-container>
}
