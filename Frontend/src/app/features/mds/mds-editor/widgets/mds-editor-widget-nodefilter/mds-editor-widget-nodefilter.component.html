@if ((hidden$ | async) !== true) {
<es-mds-editor-widget-container
  #container
  [injectedView]="this"
  [label]="true"
  [widget]="widget"
  [wrapInFormField]="false"
>
  <div class="node-row">
    <es-node-row [columns]="columns" [node]="node$ | async"></es-node-row>
    <button
      mat-icon-button
      color="primary"
      (click)="clearFilter()"
      matTooltip="{{ 'CLICKTOREMOVE' | translate }}"
    >
      <i esIcon="cancel" [aria]="false"></i>
    </button>
  </div>
</es-mds-editor-widget-container>
}
