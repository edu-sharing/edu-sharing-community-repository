@if (isBulk()) {
<!-- content projection instead of [message], since the hint needs the `total` interpolation -->
<es-info-message mode="info" class="bulk-hint">
  {{ 'WORKSPACE.CONTRIBUTOR.BULK.HINT' | translate : { total: nodeCount() } }}
</es-info-message>
}
<es-contributors-list
  bucket="lifecycle"
  [entries]="entries()"
  [nodeCount]="nodeCount()"
  (remove)="onRemove($event)"
  (edit)="onEdit($event)"
  (add)="onAdd('lifecycle')"
></es-contributors-list>
<es-contributors-list
  bucket="metadata"
  [entries]="entries()"
  [nodeCount]="nodeCount()"
  (remove)="onRemove($event)"
  (edit)="onEdit($event)"
  (add)="onAdd('metadata')"
></es-contributors-list>
