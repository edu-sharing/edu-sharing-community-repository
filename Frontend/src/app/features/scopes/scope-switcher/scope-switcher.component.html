@if (visible()) {
<button
  mat-button
  class="scope-switcher"
  [class.active]="!!activeScope()"
  [matMenuTriggerFor]="scopeMenu"
  (menuOpened)="loadScopes()"
  [disabled]="switching()"
  [matTooltip]="'SCOPES.SWITCHER.TOOLTIP' | translate"
  [attr.aria-label]="'SCOPES.SWITCHER.TOOLTIP' | translate"
  data-test="scope-switcher-button"
>
  <i esIcon="hub"></i>
  <span class="label">
    @if (activeScope(); as scope) {
    {{ scope.definition?.displayName || scope.scopeId }}
    @if (readOnly()) {
    <span class="read-only">({{ 'SCOPES.SWITCHER.READ_ONLY' | translate }})</span>
    } } @else {
    {{ 'SCOPES.SWITCHER.GLOBAL' | translate }}
    }
  </span>
  <i esIcon="keyboard_arrow_down" class="arrow"></i>
</button>
<mat-menu #scopeMenu="matMenu" class="scope-switcher-menu">
  <div class="menu-heading" mat-menu-item disabled>
    {{ 'SCOPES.SWITCHER.HEADING' | translate }}
  </div>
  <button
    mat-menu-item
    (click)="select(null)"
    [class.selected]="!activeScope()"
    data-test="scope-switcher-global"
  >
    <i [esIcon]="!activeScope() ? 'radio_button_checked' : 'radio_button_unchecked'"></i>
    <span>{{ 'SCOPES.SWITCHER.GLOBAL' | translate }}</span>
  </button>
  @if (scopes() === null) {
  <div mat-menu-item disabled>{{ 'SCOPES.SWITCHER.LOADING' | translate }}</div>
  } @for (scope of scopes(); track scope.scopeId) {
  <button
    mat-menu-item
    (click)="select(scope.scopeId)"
    [disabled]="!isSelectable(scope) && activeScope()?.scopeId !== scope.scopeId"
    [class.selected]="activeScope()?.scopeId === scope.scopeId"
    [attr.data-test]="'scope-switcher-' + scope.scopeId"
  >
    <i
      [esIcon]="
        activeScope()?.scopeId === scope.scopeId ? 'radio_button_checked' : 'radio_button_unchecked'
      "
    ></i>
    <span>{{ scope.displayName || scope.scopeId }}</span>
    @if (scope.temporary || scope.role !== 'EDITOR') {
    <span class="read-only">({{ 'SCOPES.SWITCHER.READ_ONLY' | translate }})</span>
    }
  </button>
  } @if (scopes()?.length === 0) {
  <div mat-menu-item disabled>{{ 'SCOPES.SWITCHER.NONE' | translate }}</div>
  }
</mat-menu>
}
