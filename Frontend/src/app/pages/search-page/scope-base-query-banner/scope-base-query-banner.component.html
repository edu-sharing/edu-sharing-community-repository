@if (scopeId()) {
<div class="banner" role="region" [attr.aria-label]="'SEARCH.SCOPE_BASE_QUERY.REGION' | translate">
  <i esIcon="manage_search" class="icon"></i>
  <div class="text">
    <div class="title">
      {{
        (isNew() ? 'SEARCH.SCOPE_BASE_QUERY.TITLE_NEW' : 'SEARCH.SCOPE_BASE_QUERY.TITLE')
          | translate : { scope: scopeName() }
      }}
    </div>
    <div class="hint">{{ 'SEARCH.SCOPE_BASE_QUERY.HINT' | translate }}</div>
  </div>
  <div class="actions">
    <button mat-button [disabled]="saving()" (click)="goBack()">
      {{ 'CANCEL' | translate }}
    </button>
    <button
      mat-flat-button
      color="primary"
      data-test="button-scope-base-query-save"
      [disabled]="saving()"
      (click)="save()"
    >
      {{ 'SEARCH.SCOPE_BASE_QUERY.SAVE' | translate }}
    </button>
  </div>
</div>
}
