<h1 esTitle class="cdk-visually-hidden">{{ 'SEARCH.TITLE' | translate }}</h1>

<mat-progress-bar
  mode="determinate"
  [value]="progressBarIsVisible ? loadingProgress.value : 0"
  [@fadeOut]="progressBarIsVisible ? 'visible' : 'hidden'"
  (animationEnd)="onProgressBarAnimationEnd()"
  [attr.aria-label]="
    progressBarIsVisible
      ? ('SEARCH.LOADING_RESULTS'
        | translate : { progress: progressBarIsVisible ? loadingProgress.value : 0 })
      : ''
  "
></mat-progress-bar>

<!-- Explicitly check if `tabBarIsVisible !== null`, so we don't insert the body before we know
whether a tab bar will be shown. The body itself always lives in the same place now. -->
@if (tabBarIsVisible !== null) {
<main>
  <mat-sidenav-container
    [class.mat-sidenav-container-right-open]="this.editorialSidebarService.sidebarOpened()"
  >
    <mat-sidenav
      #rightSidenav
      [mode]="'side'"
      [opened]="this.editorialSidebarService.sidebarOpened()"
      [defaultWidthPx]="600"
      [maxWidth]="0.5"
      class="es-mat-sidenav"
      storageKey="SEARCH_SIDENAV_RIGHT_WIDTH"
      esResizableSidenav
      position="end"
    >
      <div class="es-mat-sidenav-content">
        <es-editorial-sidebar [primaryMode]="'search'"></es-editorial-sidebar>
      </div>
    </mat-sidenav>
    <!-- Always-visible tab ("Lasche") on the left edge to open/close the filter panel,
      mirroring the editorial sidebar/filter toggle. -->
    <es-edge-toggle
      data-test="button-toggle-sidebar-filters-search"
      [side]="'start'"
      [open]="filterBarOpen()"
      [visible]="(showingAllRepositories | async) === false && (isMobileScreen | async) === false"
      [drawer]="filtersSidebar()"
      [measure]="'edge'"
      [animatePane]="false"
      [labelOpen]="'SEARCH.OPEN_FILTERS'"
      [labelClose]="'SEARCH.CLOSE_FILTERS'"
      (toggled)="toggleFilters()"
    ></es-edge-toggle>
    <es-search-page-filters-sidebar #filtersSidebarEl></es-search-page-filters-sidebar>
    <div class="main-content">
      @if (tabBarIsVisible) {
      <nav mat-tab-nav-bar [tabPanel]="tabPanel">
        @if (availableRepositories.getValue().length > 1) {
        <a
          mat-tab-link
          [routerLink]="['./all']"
          [queryParams]="queryParamsAllRepositories"
          queryParamsHandling="merge"
          (click)="goToAll()"
          routerLinkActive
          #routerLinkActive="routerLinkActive"
          [active]="routerLinkActive.isActive"
        >
          {{ 'SEARCH.REPOSITORY_ALL' | translate }}
        </a>
        } @for (repository of availableRepositories.getValue(); track repository) {
        <a
          mat-tab-link
          (click)="goToRepository(repository)"
          [active]="repository.id === activeRepository.getValue()"
        >
          <div class="repository-icon">
            <img [src]="repository | repositoryIcon" alt="" />
          </div>
          {{ repository.title }}
        </a>
        }
      </nav>
      }
      <mat-tab-nav-panel #tabPanel class="search-page-body">
        <router-outlet></router-outlet>
      </mat-tab-nav-panel>
    </div>
  </mat-sidenav-container>
</main>
}

<es-footer scope="search"></es-footer>
