@if (!dataSourceCollectionProposals?.isEmpty()) {
<section class="collections-cards-div">
  <div class="content-header heading-group">
    <h2 class="mat-heading-3">
      {{ 'COLLECTIONS.PROPOSALS.TITLE' | translate }}
    </h2>
    <es-actionbar></es-actionbar>
  </div>
  <es-node-entries-wrapper
    [elementInteractionType]="InteractionType.Emitter"
    #listProposals
    [dataSource]="dataSourceCollectionProposals"
    [scope]="Scope.CollectionsProposals"
    [displayType]="displayType"
    [columns]="proposalColumns"
    [globalOptions]=""
    (clickItem)="contentClick.emit($event)"
    (dblClickItem)="contentDblClick.emit($event)"
    (selectionChange)="selectionChange.emit($event.source.selected)"
    class="no-padding"
  ></es-node-entries-wrapper>
</section>
}
