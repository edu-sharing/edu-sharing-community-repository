<div #subTreeWrapper class="sub-tree-wrapper" [attr.role]="depth === 0 ? 'tree' : 'group'">
  <es-dropdown #dropdown [options]="entriesService.options?.[Target.ListDropdown]"></es-dropdown>
  <button
    #dropdownTrigger="matMenuTrigger"
    mat-button
    class="dropdown-dummy cdk-visually-hidden"
    [style.left.px]="dropdownLeft"
    [style.top.px]="dropdownTop"
    tabindex="-1"
    aria-hidden="true"
    [matMenuTriggerFor]="dropdown.menu"
  ></button>

  <div *ngIf="_nodes && _nodes.length" [@open]="_nodes && _nodes.length">
    <div *ngFor="let node of _nodes; let i = index" (contextmenu)="contextMenu($event, node)">
      <div
        class="sub-tree-element"
        role="treeitem"
        [attr.tabindex]="getTabIndex(node)"
        (focus)="onTreeItemFocus(node)"
        cdkDrag
        [cdkDragDisabled]="ui.isTouchSubject | async"
        [cdkDragData]="[node]"
        esNodesDrag
        [esNodesDropTarget]="node"
        [canDropNodes]="canDropOnNode"
        (nodeDropped)="onDropped($event)"
        [style.paddingLeft.px]="(depth + 1) * 20"
        [class.sub-tree-element-selected]="isSelected(node)"
        [attr.aria-selected]="isSelected(node)"
        [attr.aria-expanded]="_hasChildren[node.ref.id] === false ? null : isOpen(node)"
        [attr.aria-level]="depth + 1"
        (click)="openOrCloseNode(node)"
        (dblclick)="openOrCloseNode(node)"
        (keydown)="onTreeItemKeydown($event, node)"
      >
        <button
          class="expand-toggle"
          (click)="toggleNodeExpansion($event, node)"
          [class.opacity-invisible]="_hasChildren[node.ref.id] === false"
          tabindex="-1"
          aria-hidden="true"
        >
          <i *ngIf="!isOpen(node)" esIcon="keyboard_arrow_right"></i>
          <i *ngIf="isOpen(node)" esIcon="keyboard_arrow_down"></i>
        </button>
        <img class="node-icon" src="{{ node | esNodeIcon | async }}" alt="" />
        <span class="name">{{ node.name }}</span>
      </div>
      <es-workspace-sub-tree
        class="sub-tree"
        *ngIf="isOpen(node)"
        [node]="node.ref.id"
        [currentPath]="currentPath"
        (loading)="setLoadingState($event, i)"
        (updateOptions)="doUpdateOptions($event)"
        (hasChildren)="_hasChildren[node.ref.id] = $event"
        (clickElement)="openPathEvent($event)"
        (dropElement)="dropToParent($event)"
        [depth]="depth + 1"
        [treeRoot]="treeRoot ?? subTreeWrapperRef"
      ></es-workspace-sub-tree>
    </div>
    <button
      mat-flat-button
      color="primary"
      class="more-items"
      (click)="loadAll()"
      *ngIf="moreItems > 0 && !loadingMore"
      [style.marginLeft.px]="50 + depth * 20"
    >
      {{ 'WORKSPACE.TREE_MORE_ITEMS' | translate : { count: moreItems } }}
    </button>
    <es-spinner
      class="more-items-loading"
      *ngIf="loadingMore"
      [style.marginLeft.px]="50 + depth * 20"
    ></es-spinner>
  </div>
  <div class="spinner" *ngIf="isLoading">
    <es-spinner-small></es-spinner-small>
  </div>
</div>
