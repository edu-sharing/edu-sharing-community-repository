<div class="landing-page">
  <div class="landing-main" role="main">
    <h1 esTitle class="cdk-visually-hidden">{{ i18nPrefix + 'TITLE' | translate }}</h1>

    <es-shortcut-entries></es-shortcut-entries>
    <div class="swimlanes">
      @for (s of swimlanes(); track s) {
      <es-dashboard-swimlane [swimlane]="s"></es-dashboard-swimlane>
      }
    </div>
  </div>
  <es-footer [scope]="landingPageScope"></es-footer>
</div>
