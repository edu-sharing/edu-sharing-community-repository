<div class="empty" *ngIf="!files()?.length">
  {{ 'EDITORIAL.SIDEBAR.SUBMISSION.ATTACHMENT_EMPTY' | translate }}
</div>
<div class="node-list" *ngIf="files()?.length">
  @for (item of files(); track item) { @if(item.assignmentFile?.referNode) {
  <div
    tabindex="0"
    (click)="click(item)"
    [class.selected]="selected() === item"
    [class.new]="!item.validationStatus || item.validationStatus === 'NOT_STARTED'"
  >
    <es-node-type-badge [node]="item.assignmentFile.referNode"></es-node-type-badge>
    <div class="title">{{ item.assignmentFile.referNode | nodeTitle }}</div>
  </div>
  } }
</div>
