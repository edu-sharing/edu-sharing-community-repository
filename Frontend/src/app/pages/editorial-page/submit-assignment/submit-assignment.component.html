<mat-tab-group>
  <mat-tab>
    <ng-template mat-tab-label>
      <i esIcon="inbox"></i>
      {{ 'EDITORIAL.SUBMIT_ASSIGNMENT.TAB_ASSIGNMENT' | translate }}
    </ng-template>
    <ng-template matTabContent>
      <div *ngIf="assignment()" class="assignment-view">
        <div class="heading">
          <span>{{ assignment() | nodeTitle }}</span>
          <button mat-icon-button click="close()"><i esIcon="close"></i></button>
        </div>
        <div class="block">
          <label for="summary">{{ 'EDITORIAL.ASSIGNMENT.FORM.SUMMARY' | translate }}</label>
          <div id="summary" class="summary" [innerHTML]="assignment().summary"></div>
        </div>
        <div class="block">
          <label>{{ 'EDITORIAL.SUBMIT_ASSIGNMENT.SUBMIT_DETAILS' | translate }}</label>
          <div class="time start-time">
            <label for="startTime">{{
              'EDITORIAL.SUBMIT_ASSIGNMENT.START_TIME' | translate
            }}</label>
            <div id="startTime">
              {{ assignment().created | formatDate : { relative: false, time: true, date: true } }}
            </div>
          </div>
          <div class="time end-time" *ngIf="assignment().endTime as endTime">
            <label for="endTime">{{ 'EDITORIAL.SUBMIT_ASSIGNMENT.END_TIME' | translate }}</label>
            <div id="endTime" class="badge">
              <i esIcon="alarm"></i>
              {{ endTime | formatDate : { relative: false, time: true, date: true } }}
            </div>
          </div>
        </div>
        <div class="block files">
          <label
            >{{ submittableFiles.getTotal() }}x
            {{ 'EDITORIAL.SUBMIT_ASSIGNMENT.SUBMITTABLE' | translate }}</label
          >
          <div>
            <es-node-entries-wrapper
              [displayType]="NodeEntriesDisplayType.SmallGrid"
              [checkbox]="false"
              [elementInteractionType]="InteractionType.Emitter"
              [dataSource]="submittableFiles"
              [columns]="columns"
            ></es-node-entries-wrapper>
          </div>
        </div>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
