<div class="topic-page">
  <div class="topic-page-body">
    @if (topicPageLoaded()) {
    <es-template-page
      #templateComponent
      [collectionId]="topicCollectionId()"
      [variantId]="topicVariantId()"
    ></es-template-page>
    }
    <!-- Editorial sidebar beside the page: previews the page's elements and hosts the options other
      modules register. Sticky, so it stays in view while the page scrolls on the window, and kept
      mounted while closed — only a registered sidebar offers its options. -->
    <div
      #sidebarColumnRef
      class="sidebar-column"
      [class.open]="editorialSidebarService.sidebarOpened()"
      esResizableSidenav
      position="end"
      storageKey="TOPIC_PAGE_SIDEBAR_WIDTH"
      [defaultWidthPx]="600"
      [minWidth]="0"
      [minWidthPx]="400"
      [maxWidthPx]="800"
    >
      <!-- `primaryMode` becomes the options scope: 'activity' leaves out the options scoped to other
        pages (workspace, search, collections, …). -->
      <es-editorial-sidebar
        [primaryMode]="'activity'"
        [showEdgeToggle]="false"
        (closeTrigger)="editorialSidebarService.sidebarOpened.set(false)"
      ></es-editorial-sidebar>
    </div>
  </div>
  <es-footer></es-footer>
</div>
