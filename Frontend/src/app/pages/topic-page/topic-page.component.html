<div class="topic-page">
  <div class="topic-page-body">
    @if (topicPageLoaded()) {
    <es-template-page
      #templateComponent
      [collectionId]="topicCollectionId()"
      [variantId]="topicVariantId()"
    ></es-template-page>
    }
    <!-- Preview column beside the page card, carrying the topic page's own preview options. It owns
      the resizable column, header/close chrome and the mobile modal. -->
    <es-preview-sidebar-wrapper
      #previewColumnRef
      [customOptions]="templatePage()?.customSidebarOptions"
      storageKey="TOPIC_PAGE_PREVIEW_SIDEBAR_WIDTH"
      [defaultWidthPx]="484"
      [minWidth]="0"
      [minWidthPx]="400"
      [maxWidthPx]="734"
    ></es-preview-sidebar-wrapper>
    <!-- Extension column beside the page: a panel another module contributes (the editorial
      sidebar hosting the chat assistant). Sticky, so it stays in view while the page scrolls on the
      window, and kept mounted while it is closed — the panel registers itself on creation, and only
      a registered sidebar offers its options. -->
    @if (customSidebarExtension(); as sidebarExtension) {
    <div
      #sidebarColumnRef
      class="custom-sidebar-extension"
      [class.open]="editorialSidebarService.sidebarOpened()"
      esResizableSidenav
      position="end"
      storageKey="TOPIC_PAGE_CUSTOM_SIDEBAR_WIDTH"
      [defaultWidthPx]="600"
      [minWidth]="0"
      [minWidthPx]="400"
      [maxWidthPx]="800"
    >
      <ng-container *ngComponentOutlet="sidebarExtension"></ng-container>
    </div>
    }
  </div>
  <es-footer></es-footer>
</div>
