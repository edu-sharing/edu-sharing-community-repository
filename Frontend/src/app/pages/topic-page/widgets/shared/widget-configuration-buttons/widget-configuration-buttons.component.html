<div class="widget-configuration-buttons">
  <!-- option 1, e.g., link -->
  <button
    *ngIf="optionOne?.isVisible"
    mat-button
    class="widget-option"
    [disabled]="updateInProgress()"
    [matTooltip]="optionOne.tooltip"
    (click)="clickOptionOne()"
  >
    <i *ngIf="optionOne.icon" [esIcon]="optionOne.icon"></i>
    <span *ngIf="optionOne.text && optionOne.text !== ''" class="widget-label">
      {{ optionOne.text }}
    </span>
  </button>
  <!-- option 2, e.g., embed -->
  <button
    *ngIf="optionTwo?.isVisible"
    mat-button
    class="widget-option"
    [disabled]="updateInProgress()"
    [matTooltip]="optionTwo.tooltip"
    (click)="clickOptionTwo()"
  >
    <i *ngIf="optionTwo.icon" [esIcon]="optionTwo.icon"></i>
    <span *ngIf="optionTwo.text && optionTwo.text !== ''" class="widget-label">
      {{ optionTwo.text }}
    </span>
  </button>
  <!-- display configuration (color + layout) -->
  <div class="widget-display-config-buttons" *ngIf="layoutOptions.length > 0">
    <label class="widget-display-config-label" [class.disabled-text]="updateInProgress()">
      {{ 'TOPIC_PAGE.WIDGET.CHOOSE_LAYOUT' | translate }}:
    </label>

    <!-- layout selection -->
    <mat-button-toggle-group
      [attr.aria-label]="ariaLabel"
      [disabled]="updateInProgress()"
      hideSingleSelectionIndicator="true"
      (change)="changeLayout()"
      [(ngModel)]="layout"
    >
      <mat-button-toggle
        *ngFor="let option of layoutOptions"
        class="display-button"
        [value]="option.value"
        [attr.aria-label]="'TOPIC_PAGE.WIDGET.LAYOUT.' + option.ariaLabel | translate"
      >
        <i *ngIf="option.icon" [esIcon]="option.icon"></i>
        <div>
          {{ 'TOPIC_PAGE.WIDGET.LAYOUT.' + option.viewValue | translate }}
        </div>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>
