<!-- note: having ngx-colors-trigger and [(ngModel)] twice is necessary for the color picker
to work properly when combining both mat-button and ngx-colors -->
@if (palette.length > 0) {
<button
  mat-button
  ngx-colors-trigger
  [acceptLabel]="acceptLabel | translate"
  [cancelLabel]="cancelLabel | translate"
  class="color-picker-button"
  [class]="customClass"
  [disabled]="disabled"
  [format]="'hex'"
  [hideColorPicker]="true"
  [hideTextInput]="true"
  [palette]="palette"
  [(ngModel)]="internalColor"
>
  <ngx-colors
    ngx-colors-trigger
    class="ngx-color-picker"
    [(ngModel)]="internalColor"
    (change)="onColorChange()"
  ></ngx-colors>
  @if (colorLabel) {
  <div>
    {{ colorLabel | translate }}
  </div>
  }
</button>
}
