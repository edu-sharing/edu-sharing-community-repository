<!-- Common widget header -->
@if (initialized()) {
<es-generic-widget-header
  [aiSupported]="aiSupported()"
  [description]="description"
  [descriptionAiGenerated]="descriptionAiGenerated()"
  [descriptionOptional]="widgetType !== WIDGETS.TEXT_WIDGET"
  [descriptionMapping]="descriptionMapping"
  [hideDescription]="hideDescription"
  [headline]="headline"
  [headlineAiGenerated]="headlineAiGenerated()"
  [headlineMapping]="headlineMapping"
  [editMode]="editMode()"
  [updateInProgress]="updateInProgress()"
  [searchInput]="searchInput()"
  (generateWithAiChanged)="onGenerateWithAiChanged($event)"
  (textChange)="onHeaderTextChange($event)"
  (searchResultsUpdated)="onSearchResultsUpdated($event)"
></es-generic-widget-header>
} @else {
<es-spinner></es-spinner>
}

<!-- Individual widget content -->
<div #widgetContainer class="es-widget-content" [class.edit-mode]="editMode()"></div>

<ng-template #configureWidgetEmbeddingTemplate>
  <es-configure-widget-embedding-dialog
    [dialogRef]="configureWidgetEmbeddingDialogRef"
    [nodeId]="nodeId"
    [propagatedNodeId]="propagatedNodeId"
    (embedWidget)="embedWidget($event)"
  ></es-configure-widget-embedding-dialog>
</ng-template>
