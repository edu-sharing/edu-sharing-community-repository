<div class="swimlane-configuration-buttons">
  <!-- display configuration (color, shape, mirror) -->
  <div class="swimlane-display-config-buttons">
    <label class="swimlane-display-config-label" [class.disabled-text]="inputsDisabled()">
      {{ 'TOPIC_PAGE.SWIMLANE.SELECT_BACKGROUND.HEADING' | translate }}:
    </label>

    <es-color-picker
      [addTransparency]="true"
      [selectedColor]="swimlaneColor"
      [disabled]="inputsDisabled()"
      [acceptLabel]="'APPLY'"
      [cancelLabel]="'CANCEL'"
      [colorLabel]="'TOPIC_PAGE.SWIMLANE.SELECT_BACKGROUND.COLOR'"
      [customClass]="'swimlane-color-picker'"
      (colorChange)="changedColor($event)"
    ></es-color-picker>

    <button
      mat-icon-button
      class="display-button"
      [disabled]="!swimlaneColor"
      [matMenuTriggerFor]="selectSwimlaneShape"
    >
      <div class="display-button-content">
        <i esIcon="shapes"></i>
        <div class="display-button-text">
          {{ 'TOPIC_PAGE.SWIMLANE.SELECT_BACKGROUND.SHAPE' | translate }}
        </div>
      </div>
    </button>

    <mat-menu #selectSwimlaneShape="matMenu" class="topic-page-menu">
      @for (option of swimlaneBackgroundShapeOptions; track option) {
      <button mat-menu-item (click)="updateSwimlaneShape(option.shape)">
        @if (option.image) {
        <i [esIcon]="option.image"></i>
        } @else {
        <es-swimlane-background-shape [shape]="option.shape"></es-swimlane-background-shape>
        }
        {{ 'TOPIC_PAGE.SWIMLANE.SELECT_BACKGROUND.' + option.viewValue | translate }}
      </button>
      }
    </mat-menu>

    <button
      mat-icon-button
      class="display-button"
      [disabled]="!swimlaneColor || swimlaneShape === SwimlaneBackgroundShape.None"
      (click)="toggleSwimlaneShapeMirroring()"
    >
      <div class="display-button-content">
        <i esIcon="compare_arrows"></i>
        <div class="display-button-text">
          {{ 'TOPIC_PAGE.SWIMLANE.SELECT_BACKGROUND.MIRROR' | translate }}
        </div>
      </div>
    </button>
  </div>
</div>
