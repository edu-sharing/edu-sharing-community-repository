@if (editorType === 'Monaco') {
<ngx-monaco-editor
  [options]="editorOptions()"
  [ngModel]="ngModel"
  (ngModelChange)="ngModelChange.emit($event)"
  [ngModelOptions]="{ standalone: true }"
></ngx-monaco-editor>
} @if (editorType === 'Textarea') {
<textarea
  [readOnly]="options?.readOnly === true"
  [ngModel]="ngModel"
  (ngModelChange)="ngModelChange.emit($event)"
  [ngModelOptions]="{ standalone: true }"
></textarea>
}
