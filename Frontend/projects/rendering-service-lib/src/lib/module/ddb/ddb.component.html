@if (activeObject()) {
<div class="ddb-wrapper">
  <img [src]="activeObject()" [alt]="node?.title || node?.name || ''" />
  <button
    mat-icon-button
    [attr.aria-label]="
      (isFullscreen() ? 'RENDERING.EXIT_FULLSCREEN' : 'RENDERING.FULLSCREEN') | translate
    "
    (click)="toggleFullscreen()"
  >
    <mat-icon>{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
  </button>
</div>
}
