<div class="binder-wrapper">
  @if (hasPreview()) {
  <div class="preview-container">
    @if (previewUrl() === '') {
    <mat-spinner [diameter]="50"></mat-spinner>
    } @if (previewUrl() !== '') {
    <iframe [title]="node?.title ?? 'Binder'" class="frame" [src]="previewUrl()"></iframe>
    }
  </div>
  }
  <div class="binder-link-container">
    @if (binderItem()?.link === '') {
    <mat-spinner [diameter]="50"></mat-spinner>
    } @if (binderItem()?.link !== '') {
    <a
      mat-flat-button
      color="primary"
      [href]="binderItem()?.link"
      target="_blank"
      [attr.aria-label]="
        (node?.title || node?.name
          ? 'RENDERING.LINK_NAME_TITLE_NEW_WINDOW'
          : 'RENDERING.LINK_NAME_NEW_WINDOW'
        )
          | translate
            : { label: ('RENDERING.LINK_TO_OBJECT' | translate), title: node?.title || node?.name }
      "
      >{{ 'RENDERING.LINK_TO_OBJECT' | translate }}</a
    >
    }
  </div>
</div>
