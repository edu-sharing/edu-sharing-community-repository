@if (fileData !== undefined) {
<div class="pdf-wrapper" [class.hide-all]="restrictedView">
  <ngx-extended-pdf-viewer
    [src]="fileData"
    [showPrintButton]="!restrictedView"
    [showDownloadButton]="false"
    [showOpenFileButton]="false"
    [textLayer]="!restrictedView"
    [enablePrint]="!restrictedView"
    [showBookModeButton]="false"
    [showFindHighlightAll]="false"
    [showDrawEditor]="false"
    [sidebarVisible]="false"
    [showHighlightEditor]="false"
    [showTextEditor]="false"
    [height]="'var(--containerHeight, 100vh)'"
    [showSecondaryToolbarButton]="false"
    [showStampEditor]="false"
    [authorization]="true"
    [useInlineScripts]="false"
  >
  </ngx-extended-pdf-viewer>
</div>
}
