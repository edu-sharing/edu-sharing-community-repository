<div class="revoked">
  <!--<h1 class="mat-heading-1">{{ node!! | nodeTitle }}</h1>-->
  <es-info-message mode="warning" class="details-message">{{
    'RENDERING.REVOKED.DETAILS' + (node?.size === '0' ? '_EMPTY' : '') | translate
  }}</es-info-message>
  <div class="details">
    <div class="date">
      <label for="revoked-date">{{ 'RENDERING.REVOKED.DATE' | translate }}:</label
      ><span
        id="revoked-date"
        >{{ node?.properties?.['ccm:revoked_date_LONG']?.[0]!! | formatDate:{relative: false, time: false} }}</span
      >
    </div>
    <div class="reason">
      <label for="revoked-reason">{{ 'RENDERING.REVOKED.REASON' | translate }}:</label
      ><span id="revoked-reason">{{ node?.properties?.['ccm:revoked_reason']?.join('') }}</span>
    </div>
  </div>
  <div class="actions">
    @if (dialogsService) {
    <button mat-button color="primary" (click)="reportRevokeFeedback()">
      <i esIcon="arrow_forward"></i>{{ 'RENDERING.REVOKED.FEEDBACK' | translate }}
    </button>
    }
  </div>
</div>
