<div
  class="tiles-container"
  cdkDropList
  cdkDropListOrientation="mixed"
  (cdkDropListDropped)="drop($event)"
  (click)="mobileEditMode = false"
>
  <ng-container *ngFor="let item of entries; let i = index">
    <mat-card
      *ngIf="i < maxItems"
      class="entry-card"
      [class.mobile-edit-mode]="mobileEditMode"
      [class.selected-entry]="i === selectedEntryIndex"
      cdkDrag
      [cdkDragDisabled]="(getDragEnabled() | async) === false && !mobileEditMode"
      (cdkDragEnded)="dragging = false"
      (cdkDragStarted)="dragging = true"
      (touchstart)="onPressStart()"
      (touchend)="onPressEnd()"
      (mousedown)="onPressStart()"
      (mouseup)="onPressEnd()"
      (contextmenu)="openContextMenu(i, $event)"
      (click)="entryClicked(item, $event)"
    >
      <button
        mat-icon-button
        class="entry-menu-button"
        [matMenuTriggerFor]="dropdown.menu"
        (click)="setSelectedMenuIndex(i, $event)"
      >
        <i esIcon="more_vert"></i>
      </button>
      <div class="entry-badge" *ngIf="item.updates > 0">
        {{ item.updates }}
      </div>
      <div class="entry-icon-wrapper" cdkDragHandle>
        <i *ngIf="item.icon" [esIcon]="item.icon" class="entry-icon"></i>
      </div>
      <div
        class="entry-title-wrapper"
        [class.reset-padding]="renameEntryVisible && i === selectedEntryIndex"
        cdkDragHandle
      >
        <span class="entry-title">
          <ng-container
            *ngIf="!renameEntryVisible || i !== selectedEntryIndex; else renameNodeTitle"
          >
            {{
              item.title ||
                (item.node | nodeTitle) ||
                (i18nPrefix + item.id | translate) ||
                'Unnamed ' + (i + 1)
            }}
          </ng-container>
          <ng-template #renameNodeTitle>
            <mat-form-field appearance="outline" class="rename-node-title">
              <mat-label>
                {{ i18nPrefix + 'CHANGE_TITLE' | translate }}
              </mat-label>
              <input
                #editInput
                matInput
                [(ngModel)]="editTitle"
                (keydown.enter)="renameEntry()"
                (blur)="renameEntry()"
                (click)="$event.stopPropagation()"
                autofocus
              />
            </mat-form-field>
          </ng-template>
        </span>
      </div>
    </mat-card>
  </ng-container>
  <mat-card *ngIf="entries.length < maxItems" class="entry-card empty" [matMenuTriggerFor]="menu">
    <div class="entry-icon-wrapper">
      <i esIcon="add" class="entry-icon"></i>
    </div>
  </mat-card>
</div>

<!-- menu to add new shortcut entries -->
<mat-menu #menu="matMenu" class="add-shortcut-entry-menu">
  <button mat-menu-item (click)="addEntry(item)" *ngFor="let item of remainingClientConfigEntries">
    <i *ngIf="item.icon" [esIcon]="item.icon"></i>
    {{ i18nPrefix + item.id | translate }}
  </button>
</mat-menu>

<!-- dropdown and dummy dropdown trigger to open it on specific positions -->
<es-dropdown #dropdown [options]="entryOptions"></es-dropdown>
<button
  mat-button
  #dropdownTrigger="matMenuTrigger"
  [matMenuTriggerFor]="dropdown.menu"
  class="dropdown-dummy cdk-visually-hidden"
  [style.left.px]="dropdownLeft"
  [style.top.px]="dropdownTop"
  tabindex="-1"
  aria-hidden="true"
></button>
