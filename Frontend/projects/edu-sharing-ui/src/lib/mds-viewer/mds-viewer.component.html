@if (!templates()) {
<es-spinner-small></es-spinner-small>
} @for (t of templates(); track t) {
<div #container class="mds-viewer">
  @if (showGroupHeadings && t.view.caption) {
  <div class="card-title-element group-heading">
    @if (t.view.icon) {
    <i [esIcon]="t.view.icon"></i>
    }<span>{{ t.view.caption }}</span>
  </div>
  }
  <div class="template" [innerHTML]="t.html"></div>
</div>
}
