<!-- dropdown button for expand/collapse + settings button -->
<div class="tree-toolbar">
  <button
    mat-stroked-button
    [matMenuTriggerFor]="menu"
    [disabled]="!dataSource || !treeControl || !dataSource.data?.length"
  >
    ausklappen
    <i esIcon="arrow_drop_down" matIconSuffix></i>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="collapseNodes()">einklappen</button>
    <button mat-menu-item (click)="expandNodes()">ausklappen</button>
  </mat-menu>

  <button mat-icon-button aria-label="Settings" [disabled]="true">
    <i esIcon="settings"></i>
  </button>
</div>

<!-- tree component -->
<div class="tree-container" cdkDropList [cdkDropListSortingDisabled]="true">
  <es-dropdown #dropdown [options]="entriesService.options?.[Target.ListDropdown]"></es-dropdown>
  <button
    #menuTrigger="matMenuTrigger"
    mat-button
    class="dropdown-dummy cdk-visually-hidden"
    [style.left.px]="dropdownLeft"
    [style.top.px]="dropdownTop"
    [matMenuTriggerFor]="dropdown.menu"
    tabindex="-1"
    aria-hidden="true"
  ></button>
  <es-node-entries-global-options
    *ngIf="(entriesService.globalOptionsSubject | async)?.length"
    [displayType]="NodeEntriesDisplayType.Tree"
  >
  </es-node-entries-global-options>
  <mat-tree
    [dataSource]="dataSource"
    [treeControl]="treeControl"
    *ngIf="dataSource && treeControl && dataSource.data?.length"
  >
    <!-- child nodes -->
    <!-- matTreeNodePaddingIndent 28 = 24 (width of icon) + 4 (gap between icon and text) -->
    <mat-tree-node
      *matTreeNodeDef="let node"
      matTreeNodePadding
      matTreeNodePaddingIndent="28"
      [class.selected]="entriesService.selection.isSelected(node.item)"
      cdkDrag
      esNodesDrag
      [cdkDragData]="getDragData(node.item)"
      [cdkDragDisabled]="!entriesService.dragDrop?.dragAllowed"
      (cdkDragStarted)="onDragStarted(node.item)"
      (cdkDragEnded)="onDragEnded()"
      [esNodesDropTarget]="node.item"
      [canDropNodes]="canDrop"
      (nodeDropped)="drop($event)"
    >
      <es-drag-preview
        *cdkDragPreview
        [node]="node.item"
        [selected]="entriesService.selection.selected"
        [item]="entriesService.columns[0]"
      ></es-drag-preview>
      <ng-container *ngTemplateOutlet="nodeInformation; context: { node: node }"></ng-container>
    </mat-tree-node>

    <!-- load more button for leaf nodes -->
    <mat-tree-node
      *matTreeNodeDef="let node; when: isLoadMoreNode"
      matTreeNodePadding
      matTreeNodePaddingIndent="28"
    >
      <div class="load-more-container">
        <button mat-button color="primary" (click)="loadFurtherChildren(node)">
          <i esIcon="refresh"></i>
          <span>{{ 'LOAD_MORE' | translate }}</span>
        </button>
      </div>
    </mat-tree-node>

    <!-- nodes with children -->
    <!-- flex-wrap: wrap; is necessary to wrap the loading containers to the next line -->
    <mat-tree-node
      class="child-tree-node"
      [class.selected]="entriesService.selection.isSelected(node.item)"
      *matTreeNodeDef="let node; when: hasChild"
      matTreeNodePadding
      matTreeNodePaddingIndent="28"
      [cdkTreeNodeTypeaheadLabel]="node.item"
      cdkDrag
      cdkDragDisabled
      esNodesDrag
      [esNodesDropTarget]="node.item"
      [canDropNodes]="canDrop"
      (nodeDropped)="drop($event)"
    >
      <es-drag-preview
        *cdkDragPreview
        [node]="node.item"
        [selected]="entriesService.selection.selected"
        [item]="entriesService.columns[0]"
      ></es-drag-preview>
      <div class="child-tree-node-container">
        <a
          matIconButton
          [attr.id]="'toggle-' + node.item.ref.id"
          class="toggle-button fade"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Toggle ' + node.item.title"
          (click)="toggleNode(node, $event)"
        >
          <i [esIcon]="treeControl.isExpanded(node) ? 'expand_less' : 'chevron_right'"></i>
        </a>
        <ng-container *ngTemplateOutlet="nodeInformation; context: { node: node }"></ng-container>
      </div>

      <ng-container *ngIf="node.isLoading()">
        <div class="flex-line-break"></div>
        <div
          class="placeholder-container"
          *ngIf="node.item.collection?.childCollectionsCount; else loading"
        >
          <div
            class="placeholder"
            *ngFor="let i of childrenIndices(node.item.collection.childCollectionsCount)"
          ></div>
        </div>
      </ng-container>
    </mat-tree-node>
  </mat-tree>
</div>

<ng-template #nodeInformation let-node="node">
  <div
    class="node-information"
    [class.cursor-pointer]="node.level > 0"
    (click)="updateSelectedNodes(node)"
  >
    <div class="general-information container">
      <ng-container *ngIf="node.item.iconURL; else previewIcon">
        <img [src]="node.item.iconURL" />
      </ng-container>
      <ng-template #previewIcon>
        <ng-container *ngIf="node.item.preview?.isIcon; else previewImage">
          <i [esIcon]="node.item.preview.url"></i>
        </ng-container>
        <ng-template #previewImage>
          <img
            [src]="node.item | esNodeImage : { maxWidth: 20, maxHeight: 20, crop: true } | async"
          />
        </ng-template>
      </ng-template>
      <span
        class="node-title"
        [class.font-bold]="node.level === 0"
        [matTooltip]="
          node.item && titleWrapper.offsetWidth < title.offsetWidth ? title.innerText : null
        "
        #titleWrapper
      >
        <span #title>
          {{ node.item | nodeTitle }}
        </span>
      </span>
    </div>
    <div
      class="action-buttons container"
      *ngIf="
        (nodeHelper.isNodeCollection(node.item) &&
          (node.item.collection?.childCollectionsCount ||
            node.item.collection?.childReferencesCount)) ||
        (node.level > 0 &&
          nodeHelper.getCollectionScopeInfo($any(node.item))?.scopeName !== 'UNKNOWN')
      "
    >
      <div
        class="node-detail"
        *ngIf="
          nodeHelper.isNodeCollection(node.item) && node.item.collection?.childCollectionsCount
        "
      >
        <i esIcon="layers"></i> {{ node.item.collection.childCollectionsCount }}
      </div>
      <div
        class="node-detail"
        *ngIf="nodeHelper.isNodeCollection(node.item) && node.item.collection?.childReferencesCount"
      >
        <i esIcon="insert_drive_file"></i> {{ node.item.collection.childReferencesCount }}
      </div>
      <ng-container *ngIf="nodeHelper.getCollectionScopeInfo($any(node.item)) as scopeInfo">
        <div class="node-detail" *ngIf="node.level > 0 && scopeInfo.scopeName !== 'UNKNOWN'">
          <i
            class="collectionScope"
            [esIcon]="scopeInfo.icon"
            esIconContext="collection-scope"
            [matTooltip]="'COLLECTION.SCOPE.' + scopeInfo.scopeName | translate"
            [altText]="'COLLECTION.SCOPE.' + scopeInfo.scopeName | translate"
          ></i>
        </div>
      </ng-container>
    </div>
  </div>
</ng-template>

<ng-container *ngIf="entriesService.dataSource.isLoadingSubject | async">
  <ng-container *ngTemplateOutlet="loading"></ng-container>
</ng-container>

<ng-template #loading>
  <es-spinner></es-spinner>
</ng-template>
