<div class="card-image-backdrop" [class.card-image-backdrop-no-permissions]="!hasPreviewPermission">
  <!-- The blur filter does not work with canvas as it does with img on Chrome, so we go for a black
  background for now. -->
  <!-- <canvas *ngIf="showCanvas" #backdropCanvas role="presentation" aria-hidden="true"></canvas> -->
  @if (!replacedWithStatic) {
  <img [src]="node | esNodeImage : { maxWidth: 300, maxHeight: 300, crop: true } | async" alt="" />
  }
</div>

@if (showCanvas) {
<canvas #canvas role="presentation" aria-hidden="true"></canvas>
} @if (!node.preview.isIcon) {
<img
  (load)="onImageLoad($event)"
  #image
  [src]="node | esNodeImage : { maxWidth: 300, maxHeight: 300, crop: true } | async"
  alt=""
  [class.display-none]="replacedWithStatic && !playAnimation"
/>
} @if (node.preview.isIcon) { @if (node.icon?.fontGlyphId) {
<div class="icon-font">
  <i [esIcon]="node.icon?.fontGlyphId"></i>
</div>
} @if (!node.icon?.fontGlyphId) {
<img
  (load)="onImageLoad($event)"
  #image
  [src]="node | esNodeImage : { maxWidth: 300, maxHeight: 300, crop: true } | async"
  alt=""
  [class.display-none]="replacedWithStatic && !playAnimation"
/>
} }
