@if (active === 'ccm:collection_ordered_position') {
<mat-slide-toggle
  [(ngModel)]="customSortingInProgress"
  (ngModelChange)="customSortingInProgressChange.emit($event)"
>
  {{ 'COLLECTIONS.SORT_SLIDER' | translate }}
</mat-slide-toggle>
} @if (columns?.length) { @if (sortDropdown.menu) {
<button [matMenuTriggerFor]="sortDropdown.menu" mat-button color="primary">
  @if (active) {
  <span>{{
    'NODE_SORT.' + active | translate : { fallback: ('NODE.' + active | translate) }
  }}</span>
  } @if (!active) {
  <span>{{ 'SORT_BY' | translate }}</span>
  } @if (active && active !== 'ccm:collection_ordered_position') {
  <i [esIcon]="'arrow_' + (direction === 'asc' ? 'upward' : 'downward')"></i>
  }
</button>
}
<es-sort-dropdown
  #sortDropdown
  [columns]="columns"
  [sortBy]="active"
  [sortAscending]="direction === 'asc'"
  (sort)="onSort($event)"
></es-sort-dropdown>
}
