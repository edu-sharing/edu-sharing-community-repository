<div
  [class]="
    'grid-card' +
    (nodeHelper.isNodeCollection(node)
      ? ' grid-card-collection grid-card-collection-scope-' +
        node.collection.scope +
        ' grid-card-collection-type-' +
        node.collection.type
      : '') +
    ($any(node).virtual ? ' grid-card-virtual' : '') +
    ' ' +
    (entriesService.singleClickHint === 'dynamic' ? ' dynamic-single-click' : '')
  "
  [style.background-color]="nodeHelper.isNodeCollection(node) ? node.collection.color : null"
  (contextmenu)="openContextmenu($event)"
  (keydown.ContextMenu)="openContextmenu($event)"
>
  <div
    *ngIf="templatesService.overlay"
    class="card-overlay"
    (click)="
      entriesService.clickItem.emit({
        element: node,
        source: ClickSource.Overlay,
      })
    "
  >
    <ng-container
      *ngTemplateOutlet="templatesService.overlay; context: { element: node }"
    ></ng-container>
  </div>
  <es-node-url
    *ngIf="entriesService.elementInteractionType === InteractionType.DefaultActionLink"
    mode="wrapper"
    [node]="node"
    esFocusState
    #cardFocusState="esFocusState"
  >
    <ng-container
      *ngTemplateOutlet="
        image;
        context: { playAnimation: cardFocusState.hovering || cardFocusState.hasFocus }
      "
    ></ng-container>
    <ng-container *ngTemplateOutlet="meta"></ng-container>
  </es-node-url>
  <ng-container *ngIf="entriesService.elementInteractionType !== InteractionType.DefaultActionLink">
    <ng-container *ngTemplateOutlet="image"></ng-container>
    <ng-container *ngTemplateOutlet="meta"></ng-container>
  </ng-container>
</div>
<ng-template #image let-playAnimation="playAnimation">
  <div
    class="card-image-area"
    (click)="
      entriesService.clickItem.emit({
        element: node,
        source: ClickSource.Preview,
      })
    "
    *ngIf="!nodeHelper.isNodeAssignment(node)"
  >
    <div *ngIf="nodeHelper.isNodeCollection(node) && node.collection.pinned" class="collection-pin">
      <i esIcon="edu-pin"></i>
    </div>

    <es-preview-image
      *ngIf="!(nodeHelper.isNodeCollection(node) && node.preview.isIcon)"
      [node]="node"
      [playAnimation]="playAnimation"
    ></es-preview-image>
    <div
      *ngIf="nodeHelper.isNodeCollection(node) && node.preview.isIcon"
      class="card-collection-image"
    >
      <i esIcon="layers"></i>
    </div>
  </div>
</ng-template>
<ng-template #meta>
  <div
    class="card-meta"
    (click)="
      entriesService.clickItem.emit({
        element: node,
        source: ClickSource.Metadata,
      })
    "
  >
    <div *ngIf="nodeHelper.isNodeAssignment(node)" class="card-assignment">
      <div class="type">
        <i esIcon="task"></i>
        <span>{{ 'ASSIGNMENT.CARD_TYPE' | translate }}</span>
        <button
          *ngIf="dropdown"
          mat-icon-button
          (click)="openMenu(node)"
          [matMenuTriggerFor]="dropdown.menu"
          [attr.aria-label]="'OPTIONS_FOR' | translate : { element: (node | nodeTitle) }"
          data-test="card-options-button"
        >
          <i esIcon="more_vert"></i>
        </button>
      </div>
      <div class="title">
        {{ node | nodeTitle }}
      </div>
      <div class="summary" [innerHTML]="$any(node).summary"></div>
      <div class="badges" *ngIf="$any(node).type === 'SUBMISSION'">
        <div class="status status-{{ $any(node).status }}">
          <i [esIcon]="$any(AssignmentStatusIcon)[$any(node).status]"></i>
          {{ 'ASSIGNMENT.STATUS.' + $any(node).status | translate }}
        </div>
        <div
          class="endTime endTime-{{ assignmentEndTimePriority(endTime) }}"
          *ngIf="$any(node).endTime as endTime"
          [matTooltip]="endTime | formatDate : { relative: false, date: true, time: true }"
        >
          <i esIcon="timer"></i
          >{{ endTime | formatDate : { relative: false, date: 'auto', time: 'auto' } }}
        </div>
      </div>
    </div>
    <ng-container *ngIf="!nodeHelper.isNodeAssignment(node)">
      <div
        *ngFor="let displayPart of entriesService.columns; let first = first"
        class="card-meta-row"
      >
        <ng-container *ngIf="first">
          <es-node-url
            *ngIf="entriesService.elementInteractionType === InteractionType.DefaultActionLink"
            [node]="node"
            #link
          >
            <es-list-base [item]="displayPart" [node]="node" [provideLabel]="false"> </es-list-base>
          </es-node-url>
          <div *ngIf="entriesService.elementInteractionType !== InteractionType.DefaultActionLink">
            <es-list-base [item]="displayPart" [node]="node" [provideLabel]="false"> </es-list-base>
          </div>
        </ng-container>
        <ng-container *ngIf="!first">
          <es-list-base [item]="displayPart" [node]="node" [provideLabel]="false"> </es-list-base>
        </ng-container>
      </div>
    </ng-container>
  </div>
  <ng-container
    *ngTemplateOutlet="templatesService.actionArea; context: { element: node }"
  ></ng-container>
</ng-template>
