@if (hasPermission && node.type === 'ccm:io' && isFromHomeRepo(node)) { @if (mode === 'likes') {
<div class="likes">
  <button
    (click)="toogleLike()"
    [disabled]="(authenticationService.observeLoginInfo() | async)?.isGuest"
    mat-icon-button
    color="primary"
    matTooltip="{{ 'RATING.LIKES' | translate }}"
  >
    <i [esIcon]="'edu-thumb_up' + (!node.rating?.user ? '_off' : '')"></i>
  </button>
  <span matTooltip="{{ 'RATING.COUNT_LIKES' | translate }}">{{ node.rating?.overall.count }}</span>
</div>
} @if (mode === 'stars') {
<div class="stars" mat-icon-button color="primary">
  @for (rating of [1, 2, 3, 4, 5]; track rating) {
  <button
    mat-icon-button
    color="primary"
    class="star"
    (click)="setRating(rating)"
    [disabled]="(authenticationService.observeLoginInfo() | async)?.isGuest"
    (focus)="hoverStar = rating"
    (mouseenter)="hoverStar = rating"
    (mouseleave)="hoverStar = 0"
    (blur)="hoverStar = 0"
    [class.star-hover]="hoverStar >= rating"
  >
    <i
      [esIcon]="
        'star' + ((hoverStar ? hoverStar >= rating : getPrimaryRating() >= rating) ? '' : '_border')
      "
      matTooltip="{{ 'RATING.STARS_RATE' | translate : { rating: rating } }}"
    ></i>
  </button>
  } @if (!!node.rating?.user) {
  <button
    mat-icon-button
    color="primary"
    class="delete"
    matTooltip="{{ 'RATING.DELETE_RATING' | translate }}"
    (click)="deleteRating()"
    [disabled]="(authenticationService.observeLoginInfo() | async)?.isGuest"
  >
    <i esIcon="clear"></i>
  </button>
  }
  <span matTooltip="{{ 'RATING.COUNT_RATINGS' | translate }}"
    >({{ node.rating?.overall.count }})</span
  >
</div>
} }
