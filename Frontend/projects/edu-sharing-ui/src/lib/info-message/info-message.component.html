@if (!dismissed()) {
<div class="block {{ mode }}">
  <div>
    <i [esIcon]="getIcon()"></i>
  </div>
  <div class="message-container">
    <div class="message">{{ message | translate }}</div>
    <ng-content></ng-content>
  </div>
  @if (closable) {
  <button
    class="close-button"
    mat-icon-button
    [attr.aria-label]="'CLOSE' | translate"
    (click)="dismissed.set(true)"
  >
    <i esIcon="close"></i>
  </button>
  }
</div>
}
