@switch (widgetType) { @case ('Custom') {
<ng-container
  *ngTemplateOutlet="
    customTemplate;
    context: {
      item: item,
      node: node,
      provideLabel: provideLabel,
      forceText: forceText
    }
  "
>
</ng-container>
} @case ('CollectionInfo') {
<es-list-collection-info
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-collection-info>
} @case ('Text') {
<es-list-text [item]="item" [node]="node" [provideLabel]="provideLabel"></es-list-text>
} @case ('NodeCounts') {
<es-list-counts [item]="item" [node]="node" [provideLabel]="provideLabel"></es-list-counts>
} @case ('NodeAssignment') {
<es-list-node-assignment
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-node-assignment>
} @case ('NodeSuggestion') {
<es-list-node-suggestion
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-node-suggestion>
} @case ('NodeLicense') {
<es-list-node-license
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-node-license>
} @case ('NodeReplicationSource') {
<es-list-node-replication-source
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-node-replication-source>
} @case ('NodeWorkflow') {
<es-list-node-workflow
  [item]="item"
  [node]="node"
  [provideLabel]="provideLabel"
></es-list-node-workflow>
} }
